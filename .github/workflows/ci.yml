name: Hello GitHub Actions
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available."
          else
            echo "Secret is not configured."
            exit 1
          fi
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: echo "Hello from Bhuvanesh!"
      - name: Show date
        run: date
      - name: Show operating system
        run: uname -a
   
    

